
services:
  teamrag:
    image: ${DOCKERHUB_USERNAME:-hemanjali18}/teamrag-knowledge-assistant:${IMAGE_TAG:-latest}
    container_name: teamrag-app

    ports:
      - "8502:8502"
      - "8000:8000"

    env_file:
      - path: .env
        required: false

    environment:
      CHROMA_DB_PATH: /app/chroma_db
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: 8502

    restart: unless-stopped
